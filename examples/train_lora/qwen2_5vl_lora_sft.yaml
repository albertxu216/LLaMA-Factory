### model
model_name_or_path: /data/LLaMA-Factory/models/Qwen2.5-VL-7B-Instruct
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
# dataset:  alpaca_zh,alpaca_en,evol_instruct,sharegpt4
dataset:  mllm_demo,identity,alpaca_en_demo # alpaca_zh_ms,ultrafeedback_binarized_ms
template: qwen2_vl
cutoff_len: 2048
max_samples: 150000
overwrite_cache: false
preprocessing_num_workers: 8
dataloader_num_workers: 8

### output
output_dir: saves/qwen2_5vl-7b/lora/sft-1214
logging_steps: 20
save_steps: 2000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 1.0
max_steps: 4500          # 控制大致时长的关键参数
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
ignore_data_skip: true
